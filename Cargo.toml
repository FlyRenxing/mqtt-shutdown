[package]
name = "mqtt-shutdown"
version = "0.2.0"
edition = "2024"
rust-version = "1.95"
description = "Subscribe to MQTT and remotely shut down or reboot this Windows PC"
license = "MIT"
repository = "https://github.com/renxing/mqtt-shutdown"
homepage = "https://github.com/renxing/mqtt-shutdown"
readme = "README.md"
publish = false

[dependencies]
rumqttc = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
windows-reactor = { path = "../vendor/windows-rs/crates/libs/reactor" }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_Threading",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[build-dependencies]
windows-reactor-setup = { path = "../vendor/windows-rs/crates/libs/reactor-setup" }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
